[package]
name = "sprint-board"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wings-plugin = { git = "https://github.com/josippapez/Wings", rev = "8745e6b4d35c8e1539b76506c3c68c110f0adf1b", package = "wings-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The frame this module is. `build-rust.sh` builds each one the manifest names.
main = []
sidebar = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
